<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="厨房小助手">
  <title>厨房小助手</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view-root"></main>

  <nav id="bottom-nav" class="bottom-nav">
    <button class="bottom-nav__item active" data-view="home">
      <span id="nav-icon-home"></span><span class="bottom-nav__label">首页</span>
    </button>
    <button class="bottom-nav__item" data-view="recipes">
      <span id="nav-icon-recipes"></span><span class="bottom-nav__label">菜谱</span>
    </button>
    <button class="bottom-nav__item" data-view="settings">
      <span id="nav-icon-settings"></span><span class="bottom-nav__label">设置</span>
    </button>
  </nav>

  <div id="toast-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/recipes.js"></script>
  <script src="js/views/recipe-wizard.js"></script>
  <script src="js/views/cooking.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>

  <script>
    // 填充底部导航图标（线条风格）
    document.getElementById('nav-icon-home').innerHTML = K.icon('home');
    document.getElementById('nav-icon-recipes').innerHTML = K.icon('recipe');
    document.getElementById('nav-icon-settings').innerHTML = K.icon('settings');
  </script>
</body>
</html>
